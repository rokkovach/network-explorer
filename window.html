<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <style>
    :root, [data-theme="dark"] {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #1c2128;
      --bg-hover: #1f2937;
      --bg-selected: #1a2744;
      --border: #30363d;
      --border-active: #58a6ff;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-dim: #1f6feb;
      --accent-glow: rgba(88, 166, 255, 0.15);
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --orange: #db6d28;
      --purple: #a371f7;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --radius: 6px;
    }
    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f8fa;
      --bg-tertiary: #f0f2f5;
      --bg-hover: #e8ebef;
      --bg-selected: #ddf4ff;
      --border: #d0d7de;
      --border-active: #0969da;
      --text-primary: #1f2328;
      --text-secondary: #656d76;
      --text-muted: #8b949e;
      --accent: #0969da;
      --accent-dim: #0550ae;
      --accent-glow: rgba(9, 105, 218, 0.1);
      --green: #1a7f37;
      --red: #cf222e;
      --yellow: #9a6700;
      --orange: #bc4c00;
      --purple: #8250df;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: var(--bg-primary);
    }
    #app-container {
      width: 100%; height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="app-container"></iframe>
  <script>
    // Pass query params through to the iframe so sidepanel.js can read tabId
    var params = window.location.search;
    document.getElementById('app-container').src = 'sidepanel.html' + params;
  </script>
</body>
</html>
